<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('hm-theme') || 'dark';
        document.documentElement.classList.toggle('light-mode', mode === 'light');
        document.documentElement.setAttribute('data-theme', mode);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireMate — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="toast-container" id="toasts"></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="modal-close" onclick="closeModal()">&#x2715;</button><div id="modal-content"></div></div></div>
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirm-icon"></div>
    <div class="confirm-title" id="confirm-title"></div>
    <div class="confirm-sub" id="confirm-sub"></div>
    <div class="confirm-actions"><button class="btn btn-ghost" id="confirm-no">Cancel</button><button class="btn" id="confirm-yes">Confirm</button></div>
  </div>
</div>

<div class="page active">
  <div class="auth-page">
    <div class="auth-bg">
      <div style="position:absolute;width:500px;height:500px;border-radius:50%;background:rgba(255,107,107,0.05);filter:blur(80px);top:-120px;left:50%;transform:translateX(-50%);"></div>
    </div>
    <div class="auth-card" style="border-color:rgba(255,107,107,0.2);">
      <div class="auth-logo">
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;">
          <div class="nav-logo-icon" style="background:var(--hot);">H</div>
          <span style="font-family:Syne,sans-serif;font-size:22px;font-weight:800;">HireMate</span>
          <span style="background:rgba(255,107,107,0.15);color:var(--hot);border:1px solid rgba(255,107,107,0.3);padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;font-family:Syne,sans-serif;text-transform:uppercase;letter-spacing:0.08em;">Admin</span>
        </div>
      </div>
      <div class="auth-title">Admin Access</div>
      <div class="auth-subtitle">Restricted to authorized administrators only. All access attempts are logged.</div>
      <form class="auth-form" onsubmit="handleAdminLogin(event)" novalidate>
        <div class="form-group">
          <label class="form-label">Admin Email</label>
          <div style="position:relative;"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;">&#x2709;</span><input class="form-input" id="admin-email" type="email" placeholder="admin@hiremate.com" autocomplete="email" style="padding-left:42px;"></div>
          <span class="form-error-msg" id="admin-email-err"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Admin Password</label>
          <div style="position:relative;"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;">&#x1F512;</span><input class="form-input" id="admin-pw" type="password" placeholder="Admin password" autocomplete="current-password" style="padding-left:42px;padding-right:44px;"><button type="button" id="tgl-adm" onclick="togglePw('tgl-adm','admin-pw')" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;">&#x1F441;</button></div>
          <span class="form-error-msg" id="admin-pw-err"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Security PIN</label>
          <div style="position:relative;"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;">#</span><input class="form-input" id="admin-pin" type="password" placeholder="4-digit PIN" inputmode="numeric" maxlength="4" autocomplete="one-time-code" style="padding-left:42px;"></div>
          <span class="form-error-msg" id="admin-pin-err"></span>
        </div>
        <div style="background:rgba(255,179,71,0.06);border:1px solid rgba(255,179,71,0.2);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--text2);display:flex;gap:8px;align-items:flex-start;">
          <span>&#x26A0;&#xFE0F;</span><span>This is a restricted area. After multiple failed attempts, login is temporarily locked.</span>
        </div>
        <button class="btn" type="submit" style="width:100%;padding:15px;background:var(--hot);color:white;box-shadow:0 0 20px rgba(255,107,107,0.2);">Sign In as Admin &#x2192;</button>
      </form>
      <div class="auth-footer"><a href="login.html">&#x2190; Back to User Login</a></div>
    </div>
  </div>
</div>
<button class="theme-toggle" onclick="toggleTheme()" style="position:fixed;top:18px;right:18px;z-index:999;" title="Toggle theme">??</button>
<script src="app.js"></script>
</body>
</html>
