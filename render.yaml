services:
  - type: web
    name: hiremate-post-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: APP_HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: groq
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
