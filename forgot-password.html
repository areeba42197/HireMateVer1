<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('hm-theme') || 'dark';
        document.documentElement.classList.toggle('light-mode', mode === 'light');
        document.documentElement.setAttribute('data-theme', mode);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireMate — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="toast-container" id="toasts"></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="modal-close" onclick="closeModal()">&#x2715;</button><div id="modal-content"></div></div></div>
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirm-icon"></div>
    <div class="confirm-title" id="confirm-title"></div>
    <div class="confirm-sub" id="confirm-sub"></div>
    <div class="confirm-actions"><button class="btn btn-ghost" id="confirm-no">Cancel</button><button class="btn" id="confirm-yes">Confirm</button></div>
  </div>
</div>

<div class="page active">
  <div class="auth-page">
    <div class="auth-bg">
      <div class="auth-glow" style="width:450px;height:450px;background:rgba(74,255,160,0.07);top:-100px;left:50%;transform:translateX(-50%);"></div>
    </div>
    <div class="auth-card">
      <div class="auth-logo">
        <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px;">
          <div class="nav-logo-icon">H</div>
          <span style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;">HireMate</span>
        </div>
      </div>
      <div style="text-align:center;margin-bottom:8px;">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;">&#x1F4E7;</div>
        <div class="auth-title">Forgot your password?</div>
        <div class="auth-subtitle" style="margin-top:6px;">No worries. Enter your email address and we will send you a reset link.</div>
      </div>
      <form class="auth-form" onsubmit="handleForgot(event)" novalidate id="forgot-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div style="position:relative;">
            <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;">&#x2709;</span>
            <input class="form-input" id="forgot-email" type="email" placeholder="you@example.com" autocomplete="email" style="padding-left:42px;">
          </div>
          <span class="form-error-msg" id="forgot-email-err"></span>
        </div>
        <div id="forgot-success" style="display:none;" class="info-box">
          <span>&#x2713;</span>
          <span id="forgot-success-msg">If an account with that email exists, a reset link has been sent. Please check your inbox.</span>
        </div>
        <div id="forgot-error" style="display:none;" class="warning-box">
          <span>!</span>
          <span id="forgot-error-msg"></span>
        </div>
        <button class="btn btn-primary" type="submit" id="forgot-btn" style="width:100%;padding:15px;">Send Reset Link &#x2192;</button>
      </form>
      <div class="auth-footer"><a href="login.html">&#x2190; Back to Sign In</a></div>
    </div>
  </div>
</div>
<script>
async function handleForgot(e) {
  e.preventDefault();
  var email = document.getElementById('forgot-email');
  var err = document.getElementById('forgot-email-err');
  var success = document.getElementById('forgot-success');
  var errorBox = document.getElementById('forgot-error');
  var btn = document.getElementById('forgot-btn');

  // Reset state
  err.textContent = '';
  email.classList.remove('is-error','is-valid');
  success.style.display = 'none';
  errorBox.style.display = 'none';

  // Validate
  if (!email.value.trim()) {
    err.textContent = 'Email address is required.';
    email.classList.add('is-error');
    showToast('error', 'Please enter your email address.');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
    err.textContent = 'Please enter a valid email address (must include @ and a domain like .com)';
    email.classList.add('is-error');
    showToast('error', 'Please enter a valid email address.');
    return;
  }

  email.classList.add('is-valid');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Sending...';

  try {
    var response = await fetch(hmApiBase() + '/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value.trim() })
    });
    var data = await response.json().catch(function() { return {}; });

    if (!response.ok || data.ok === false) {
      throw new Error(data.error || 'Something went wrong. Please try again.');
    }

    // Success
    btn.style.display = 'none';
    document.getElementById('forgot-success-msg').textContent = data.message || 'If an account with that email exists, a reset link has been sent. Please check your inbox.';
    success.style.display = 'flex';
    email.disabled = true;
    showToast('success', 'Reset instructions sent! Check your email.');
  } catch (ex) {
    btn.disabled = false;
    btn.innerHTML = 'Send Reset Link &#x2192;';
    document.getElementById('forgot-error-msg').textContent = ex.message;
    errorBox.style.display = 'flex';
    showToast('error', ex.message);
  }
}
</script>
<button class="theme-toggle" onclick="toggleTheme()" style="position:fixed;top:18px;right:18px;z-index:999;" title="Toggle theme">??</button>
<script src="app.js"></script>
</body>
</html>
