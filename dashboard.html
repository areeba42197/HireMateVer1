<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('hm-theme') || 'dark';
        document.documentElement.classList.toggle('light-mode', mode === 'light');
        document.documentElement.setAttribute('data-theme', mode);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HireMate - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body class="hm-data-booting">
<div class="toast-container" id="toasts"></div>
<div class="modal-overlay" id="modal"><div class="modal"><button class="modal-close" onclick="closeModal()">&#x2715;</button><div id="modal-content"></div></div></div>
<div class="confirm-overlay" id="confirm-overlay">

    <div class="confirm-icon" id="confirm-icon"></div>
    <div class="confirm-title" id="confirm-title"></div>
    <div class="confirm-sub" id="confirm-sub"></div>
    <div class="confirm-actions"><button class="btn btn-ghost" id="confirm-no">Cancel</button><button class="btn" id="confirm-yes">Confirm</button></div>
  </div>
</div>

<div class="page active">
  <nav class="navbar">

      <div class="nav-logo-icon">H</div>HireMate
    </div>

    <div class="nav-actions"><button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme"></button>
      <button class="btn btn-ghost btn-sm" onclick="window.location.href='profile.html'">Profile</button>
      <div class="avatar" onclick="window.location.href='profile.html'">AS</div>
      <button class="btn btn-ghost btn-sm" onclick="confirmLogout()">Logout</button>

    <main class="main-content">
      <div style="margin-bottom:28px;">
        <h1 class="page-title">Welcome back</h1>

        <div class="stat-card s4 hm-loading-card"><div class="stat-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="m7.5 12.5 3 3 6-7"></path></svg></div><div class="stat-value"><span class="hm-skeleton hm-skeleton-number"></span></div><div class="stat-label">Approved This Week</div><div class="stat-change"><span class="hm-skeleton hm-skeleton-line"></span></div></div>

      <div class="leads-header">
        <div class="leads-title">Recent Leads</div>
        <button class="btn btn-outline btn-sm" onclick="window.location.href='leads.html'">View All &#x2192;</button>
      </div>
      <div class="leads-grid"><div class="hm-skeleton-card"></div><div class="hm-skeleton-card"></div><div class="hm-skeleton-card"></div></div>
    </main>
  </div>
</div>
